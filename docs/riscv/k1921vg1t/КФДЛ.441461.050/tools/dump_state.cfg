source [find interface/jlink.cfg]
transport select jtag
adapter speed 100
reset_config srst_only srst_open_drain connect_deassert_srst
source [find target/k1921vg1t_singlecore.cfg]

init
halt
mdw 0x00000000 4
reg pc
mdw 0x50004050
mdw 0x5000402c
mdw 0x50003008
mdw 0x52010024
mdw 0x52010028
mdw 0x5201002c
mdw 0x52010030
mdw 0x52010018
mdw 0x4000103c
mdw 0x40001034
shutdown
